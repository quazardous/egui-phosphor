[package]
name = "egui-pop-phosphor"
description = "Phosphor icons for egui: a maintained fork of egui-phosphor for egui 0.37, until upstream releases"
version = "0.15.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quazardous/egui-phosphor"
readme = "README.md"
keywords = ["egui", "icons", "phosphor", "font"]
categories = ["gui"]

[lib]
name = "egui_phosphor"

[dependencies]
egui = { version = "0.37", default-features = false }

[features]
default = ["regular"]
thin = []
light = []
regular = []
bold = []
fill = []
# Compile-time font subsetting via the `subset!` macro. Adds no dependencies.
# No cost to include all variants, since a subset only embeds the icons you name.
subset = ["thin", "light", "regular", "bold", "fill"]

[dev-dependencies]
eframe = "0.37"

[[example]]
name = "multiple_variants"
required-features = ["thin", "light", "regular", "bold", "fill"]

[[example]]
name = "subset"
required-features = ["subset"]

[[test]]
name = "subset"
required-features = ["subset"]

[[test]]
name = "multi_variant"
required-features = ["subset"]
